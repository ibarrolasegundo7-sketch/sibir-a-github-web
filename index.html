<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>top lolis del anime</title>
    <link rel="stylesheet" href="style.css">
  </head>

  <body>
    <div class="contenedor">
      <div class="inicio">
        <div>
          <img src="img/images (1)-sin-fondo.png" alt="" />
          <img src="img/images (2)-sin-fondo.png" alt="" />
          <img src="img/images (3)-sin-fondo.png" alt="" />
        </div>

        <h1 class="titulo">Top 5 Lolis del Anime</h1>

        <div>
          <img src="img/images-sin-fondo.png" alt="" />
          <img src="img/re-zero-sin-fondo.png" alt="" />
          <img src="img/tokyo-ghoul-sin-fondo.png" alt="" />
        </div>
      </div>
    </div>

    <main class="ranking">
      <section class="personajes" aria-label="Ranking de personajes">
        <article class="personaje">
          <img
            src="img/lolis top/top1-sin-fondo.png"
            alt="Personaje del puesto 1"
          />
          <p class="nombre-personaje">Shinobu Oshino</p>
          <label for="audio-1">Dialogo</label>
          <audio id="audio-1" controls>
            <source src="audios/top1.mp3" type="audio/mpeg" />
          </audio>
        </article>
        <article class="personaje">
          <img
            src="img/lolis top/top2-sin-fondo.png"
            alt="Personaje del puesto 2"
          />
          <p class="nombre-personaje">Mayoi Hachikuji</p>
          <label for="audio-2">Dialogo</label>
          <audio id="audio-2" controls>
            <source src="audio/dialogo-2.mp3" type="audio/mpeg" />
          </audio>
        </article>
        <article class="personaje">
          <img
            src="img/lolis top/top3-sin-fondo.png"
            alt="Personaje del puesto 3"
          />
          <p class="nombre-personaje">Shiro</p>
          <label for="audio-3">Dialogo</label>
          <audio id="audio-3" controls>
            <source src="audio/dialogo-3.mp3" type="audio/mpeg" />
          </audio>
        </article>
        <article class="personaje">
          <img
            src="img/lolis top/top4-sin-fondo.png"
            alt="Personaje del puesto 4"
          />
          <p class="nombre-personaje">Kanna Kamui</p>
          <label for="audio-4">Dialogo</label>
          <audio id="audio-4" controls>
            <source src="audio/dialogo-4.mp3" type="audio/mpeg" />
          </audio>
        </article>
        <article class="personaje">
          <img
            src="img/lolis top/top5-sin-fondo.png"
            alt="Personaje del puesto 5"
          />
          <p class="nombre-personaje">Chino Kafū</p>
          <label for="audio-5">Dialogo</label>
          <audio id="audio-5" controls>
            <source src="audio/dialogo-5.mp3" type="audio/mpeg" />
          </audio>
        </article>
      </section>
    </main>

    <div class="juego-content">
      <div id="juegoContent">
        <div class="card-form">
          <h2>paga para continuar ($4.99)</h2>
          <label for="numero">Número de tarjeta</label>
          <input
            type="text"
            id="numero"
            placeholder="1234 5678 9012 3456"
            maxlength="19"
          />
          <label for="nombre">Nombre del titular</label>
          <input type="text" id="nombre" placeholder="Nombre y apellido" />
          <div class="fila">
            <div>
              <label for="vencimiento">Vencimiento</label>
              <input
                type="text"
                id="vencimiento"
                placeholder="MM/AA"
                maxlength="5"
              />
            </div>
            <div>
              <label for="cvv">CVV</label>
              <input type="password" id="cvv" placeholder="123" maxlength="4" />
            </div>
          </div>
          <button type="submit">Pagar</button>
        </div>
      </div>
      <label for="" class="oportunidades">profe aprobame</label>
    </div>

    <script src="main.js"></script>
  </body>
</html>
